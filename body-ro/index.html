<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Body RO Tracker</title>
<style>
:root{--bg:#0f1115;--card:#171b22;--card2:#202630;--line:#303846;--txt:#f5f7fa;--muted:#aab3c2;--green:#38d27d;--amber:#ffbd59;--red:#ff6b6b;--blue:#5da9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:14px 16px;font-weight:900;min-height:52px;background:var(--green);color:#06110b}.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.danger{background:var(--red);color:#260606}.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}.side{background:#0b0d11;border-right:1px solid var(--line);padding:16px}.main{padding:18px}.brand{font-size:24px;font-weight:950}.sub,.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{background:var(--card);color:var(--muted);border:1px solid var(--line)}.tab.active{background:var(--green);color:#06110b}.search,input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:16px;padding:14px;font-size:16px}.search{margin:12px 0;background:var(--card)}.list{margin-top:10px}.ro{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;cursor:pointer}.ro.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(56,210,125,.18)}.rohead{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:950}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;background:#2b3340;color:var(--muted);white-space:nowrap}.p-intacto{color:var(--blue);background:rgba(93,169,255,.14)}.p-revision,.p-piezas{color:var(--amber);background:rgba(255,189,89,.15)}.p-proceso,.p-armado{color:var(--green);background:rgba(56,210,125,.15)}.p-entregado{color:#ccd5df;background:rgba(170,179,194,.16)}.bar{height:8px;background:#2d3541;border-radius:999px;overflow:hidden;margin:12px 0 8px}.fill{height:100%;background:var(--green)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}.h1{font-size:30px;font-weight:950}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px}.label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.value{font-size:22px;font-weight:950;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{min-width:110px}.check{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;cursor:pointer}.mark{width:26px;height:26px;border-radius:8px;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);font-weight:950;flex:0 0 26px}.check.done{opacity:.75}.check.done .mark{background:var(--green);color:#06110b}.small{font-size:13px;color:var(--muted)}.empty{display:grid;place-items:center;min-height:70vh;text-align:center;color:var(--muted)}.dialog{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}.dialog.show{display:flex}.modal{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;width:min(620px,100%)}.x{float:right;background:transparent;color:var(--muted);font-size:28px;padding:0;min-height:0}.note{background:rgba(255,189,89,.10);border-left:4px solid var(--amber);border-radius:12px;padding:12px}.err{background:rgba(255,107,107,.10);border-left:4px solid var(--red);border-radius:12px;padding:12px}@media(max-width:900px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr 1fr}.row{display:grid}.actions button{width:100%}.h1{font-size:24px}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Body RO Tracker</div>
    <div class="sub">Tablet simple para ROs, horas body, checklist y materiales. Guarda en este dispositivo.</div>
    <div class="row" style="margin-top:12px"><button id="newBtn" type="button">+ Nuevo RO</button><button id="exportBtn" class="secondary" type="button">Exportar</button></div>
    <div class="tabs"><button id="activeTab" class="tab active" type="button">Actuales <span id="nActive"></span></button><button id="doneTab" class="tab" type="button">Terminados <span id="nDone"></span></button></div>
    <input id="search" class="search" placeholder="Buscar RO, vehículo o área" autocomplete="off">
    <div id="list" class="list"></div>
  </aside>
  <main class="main"><div id="detail" class="empty">Selecciona un RO.</div></main>
</div>
<div id="modal" class="dialog"><div class="modal"><button id="closeModal" class="x" type="button">×</button><h2>Nuevo RO</h2><div class="row"><input id="mRo" placeholder="RO number"><input id="mVehicle" placeholder="Vehículo"></div><br><input id="mArea" placeholder="Área de daño"><br><br><div class="row"><select id="mStatus"></select><input id="mEst" type="number" step="0.25" placeholder="Horas estimadas"></div><br><textarea id="mNotes" placeholder="Notas"></textarea><br><br><button id="saveNew" style="width:100%" type="button">Guardar RO</button></div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var STATUS=[['intacto','Intacto',5],['revision','Desarmado revisión',20],['aprobado','Desarmado aprobado',35],['proceso','En proceso',55],['piezas','Esperando piezas',45],['pintura','En pintura',70],['armado','Armado',88],['entregado','Entregado',100]];
var CHECKS=['Confirmar RO y vehículo','Fotos iniciales','Desarme del área dañada','Revisar daño oculto','Reparación / cuadratura / fitment','Listo para siguiente etapa'];
var DEMO=[{ro:'45821',vehicle:'2021 Toyota RAV4',area:'Frente izquierdo',status:'revision',est:7,week:2.5,notes:'Bumper off. Revisar bracket detrás del headlamp.',checks:[1,1,0,0,0,0],materials:['P59732 clips x8'],history:['RO creado']},{ro:'45843',vehicle:'2019 Chevy Silverado',area:'Bedside derecho',status:'proceso',est:9.5,week:6.25,notes:'Reparación de bedside en proceso.',checks:[1,1,1,1,0,0],materials:['Sound deadening 0.6 m'],history:['RO creado']}];
var state={active:[],done:[],view:'active',selected:null,q:''};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function stamp(t){return today()+' — '+t}
function data(){return state.view==='active'?state.active:state.done}
function findStatus(id){return STATUS.find(function(s){return s[0]===id})||STATUS[0]}
function statusIndex(id){var n=STATUS.findIndex(function(s){return s[0]===id});return n<0?0:n}
function statusClass(id){return 'p-'+id}
function save(){localStorage.setItem('body_ro_tracker_v5',JSON.stringify(state))}
function load(){try{var old=localStorage.getItem('body_ro_tracker_v5')||localStorage.getItem('body_ro_tracker_archive_v4')||localStorage.getItem('body_ro_tracker_archive_v3');if(old){var d=JSON.parse(old);state.active=d.active||[];state.done=d.done||[];state.view=d.view||'active';state.selected=d.selected||null}}catch(e){}if(!state.active.length&&!state.done.length){state.active=DEMO.slice();state.done=[]}if(!state.selected){state.selected=(data()[0]||state.active[0]||{}).ro||null}}
function hist(r,msg){r.history=r.history||[];r.history.push(stamp(msg))}
function renderTabs(){$('activeTab').className='tab '+(state.view==='active'?'active':'');$('doneTab').className='tab '+(state.view==='done'?'active':'');$('nActive').textContent='('+state.active.length+')';$('nDone').textContent='('+state.done.length+')'}
function filtered(){var q=state.q.toLowerCase().trim();return data().filter(function(r){return !q||(r.ro+' '+r.vehicle+' '+r.area+' '+r.notes).toLowerCase().indexOf(q)>-1})}
function renderList(){var h='';filtered().forEach(function(r){var s=findStatus(r.status);h+='<div class="ro '+(state.selected===r.ro?'active':'')+'" data-ro="'+esc(r.ro)+'"><div class="rohead"><div><div class="title">RO '+esc(r.ro)+'</div><div class="muted">'+esc(r.vehicle)+'</div></div><span class="pill '+statusClass(r.status)+'">'+esc(s[1])+'</span></div><div class="small" style="margin-top:8px">'+esc(r.area)+'</div><div class="bar"><div class="fill" style="width:'+s[2]+'%"></div></div><div class="meta"><span>'+(state.view==='done'?'Entregado: '+esc(r.deliveredAt||'sin fecha'):Number(r.week||0).toFixed(2)+' hrs semana')+'</span><span>'+Number(r.est||0).toFixed(2)+' hrs est.</span></div></div>'});$('list').innerHTML=h||'<div class="muted">Sin ROs.</div>'}
function selected(){return data().find(function(r){return r.ro===state.selected})}
function statusOptions(current){return STATUS.filter(function(s){return s[0]!=='entregado'}).map(function(s){return '<option value="'+s[0]+'" '+(s[0]===current?'selected':'')+'>'+esc(s[1])+'</option>'}).join('')}
function renderDetail(){var r=selected();if(!r){$('detail').className='empty';$('detail').innerHTML='Selecciona un RO.';return}$('detail').className='';var s=findStatus(r.status),done=state.view==='done';var checks=CHECKS.map(function(c,i){var ok=r.checks&&r.checks[i];return '<div class="check '+(ok?'done':'')+'" data-action="check" data-i="'+i+'"><div class="mark">'+(ok?'✓':'')+'</div><div><b>'+esc(c)+'</b><div class="small">Toca para marcar o desmarcar</div></div></div>'}).join('');var mats=(r.materials||[]).map(function(m){return '<span class="pill">'+esc(m)+'</span>'}).join(' ')||'<span class="muted">Sin materiales registrados.</span>';var history=(r.history||[]).map(function(x){return '<div class="small">• '+esc(x)+'</div>'}).join('')||'<div class="small">Sin historial.</div>';var controls=done?'<button data-action="reopen" type="button">Reingresó al taller</button>':'<button class="secondary" data-action="prev" type="button">← Estado anterior</button><select id="statusSelect">'+statusOptions(r.status)+'</select><button data-action="next" type="button">Siguiente estado →</button><button class="danger" data-action="deliver" type="button">Marcar entregado</button>';$('detail').innerHTML='<div class="panel"><div class="h1">RO '+esc(r.ro)+' • '+esc(r.vehicle)+'</div><div class="muted">'+esc(r.area)+'</div><br><span class="pill '+statusClass(r.status)+'">'+esc(s[1])+'</span></div><div class="grid"><div class="box"><div class="label">Lista</div><div class="value">'+(done?'Terminado':'Actual')+'</div></div><div class="box"><div class="label">Estado</div><div class="value">'+esc(s[1])+'</div></div><div class="box"><div class="label">Horas semana</div><div class="value">'+Number(r.week||0).toFixed(2)+'</div></div><div class="box"><div class="label">Horas estimadas</div><div class="value">'+Number(r.est||0).toFixed(2)+'</div></div></div><div class="panel"><div class="label">Control rápido</div><br><div class="actions">'+controls+'</div>'+(r.status==='piezas'?'<br><div class="note">Este RO está detenido por piezas. No lo entregues hasta resolverlo.</div>':'')+'</div><div class="panel"><div class="label">Sumar horas</div><br><div class="actions"><button class="secondary" data-action="hours" data-h="0.25" type="button">+0.25</button><button class="secondary" data-action="hours" data-h="0.5" type="button">+0.5</button><button class="secondary" data-action="hours" data-h="1" type="button">+1</button><button class="secondary" data-action="hours" data-h="2" type="button">+2</button><button class="secondary" data-action="reset" type="button">Reset semana</button></div></div><div class="panel"><div class="label">Checklist body</div>'+checks+'</div><div class="panel"><div class="label">Hardware y materiales</div><p>'+mats+'</p><div class="row"><input id="matInput" placeholder="Ej: P59732 clips x4"><button class="secondary" data-action="mat" type="button">Agregar</button></div></div><div class="panel"><div class="label">Notas</div><br><textarea id="notesBox">'+esc(r.notes)+'</textarea><br><br><button class="secondary" data-action="notes" type="button">Guardar notas</button></div><div class="panel"><div class="label">Historial</div><br>'+history+'</div>';var sel=$('statusSelect');if(sel){sel.addEventListener('change',function(){r.status=this.value;hist(r,'Estado cambiado a '+findStatus(r.status)[1]);save();render()})}}
function render(){renderTabs();renderList();renderDetail()}
function moveDone(r){var i=state.active.indexOf(r);if(i<0)return;state.active.splice(i,1);r.status='entregado';r.week=0;r.deliveredAt=today();hist(r,'Marcado como entregado');state.done.unshift(r);state.view='done';state.selected=r.ro;save();render()}
function reopen(r){var i=state.done.indexOf(r);if(i<0)return;state.done.splice(i,1);r.status='intacto';r.week=0;hist(r,'Reingresó al taller');state.active.unshift(r);state.view='active';state.selected=r.ro;save();render()}
$('list').addEventListener('click',function(e){var card=e.target.closest('.ro');if(!card)return;state.selected=card.dataset.ro;save();render()});
$('detail').addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var r=selected();if(!r)return;var a=b.dataset.action;if(a==='reopen'){reopen(r);return}if(state.view==='done')return;if(a==='prev'){r.status=STATUS[Math.max(0,statusIndex(r.status)-1)][0];hist(r,'Estado cambiado a '+findStatus(r.status)[1])}if(a==='next'){var ni=Math.min(STATUS.length-1,statusIndex(r.status)+1);if(STATUS[ni][0]==='entregado'){moveDone(r);return}r.status=STATUS[ni][0];hist(r,'Estado cambiado a '+findStatus(r.status)[1])}if(a==='deliver'){if(confirm('¿Marcar este RO como entregado?')){moveDone(r);return}}if(a==='hours'){r.week=Number(r.week||0)+Number(b.dataset.h||0);hist(r,'Horas +'+b.dataset.h)}if(a==='reset'){r.week=0;hist(r,'Horas semanales reiniciadas')}if(a==='check'){var i=Number(b.dataset.i);r.checks=r.checks||[0,0,0,0,0,0];r.checks[i]=r.checks[i]?0:1;hist(r,(r.checks[i]?'Completado: ':'Desmarcado: ')+CHECKS[i])}if(a==='mat'){var v=($('matInput')||{}).value||'';v=v.trim();if(!v)return;r.materials=r.materials||[];r.materials.push(v);hist(r,'Material agregado: '+v)}if(a==='notes'){r.notes=($('notesBox')||{}).value||'';hist(r,'Notas actualizadas')}save();render()});
$('search').addEventListener('input',function(){state.q=this.value;renderList()});
$('activeTab').addEventListener('click',function(){state.view='active';state.selected=(state.active[0]||{}).ro||null;save();render()});
$('doneTab').addEventListener('click',function(){state.view='done';state.selected=(state.done[0]||{}).ro||null;save();render()});
$('newBtn').addEventListener('click',function(){$('mStatus').innerHTML=statusOptions('intacto');['mRo','mVehicle','mArea','mEst','mNotes'].forEach(function(id){$(id).value=''});$('modal').classList.add('show')});
$('closeModal').addEventListener('click',function(){$('modal').classList.remove('show')});
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))$('modal').classList.remove('show')});
$('saveNew').addEventListener('click',function(){var r={ro:$('mRo').value.trim(),vehicle:$('mVehicle').value.trim(),area:$('mArea').value.trim(),status:$('mStatus').value||'intacto',est:Number($('mEst').value||0),week:0,notes:$('mNotes').value,checks:[0,0,0,0,0,0],materials:[],history:[stamp('RO creado')]};if(!r.ro||!r.vehicle){alert('Falta RO o vehículo');return}state.active.unshift(r);state.view='active';state.selected=r.ro;$('modal').classList.remove('show');save();render()});
$('exportBtn').addEventListener('click',function(){var blob=new Blob([JSON.stringify({active:state.active,done:state.done},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='body-ro-tracker-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)});
try{load();render()}catch(e){document.body.innerHTML='<pre class="err">Error al iniciar: '+esc(e.message)+'</pre>';throw e}
})();
</script>
</body>
</html>
