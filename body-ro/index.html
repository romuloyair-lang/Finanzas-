<html lang="es">
<head>

<title>Body RO Tracker</title>
<style>
:root{--bg:#0f1115;--left:#0b0d11;--panel:#171b22;--panel2:#202630;--line:#303846;--text:#f5f7fa;--muted:#aab3c2;--green:#38d27d;--blue:#5da9ff;--amber:#ffbd59;--red:#ff6b6b;--purple:#b98cff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{display:grid;grid-template-columns:370px 1fr;height:100vh;overflow:hidden}.left{background:var(--left);border-right:1px solid var(--line);padding:16px;overflow:auto}.right{padding:18px;overflow:auto}.brand{font-size:22px;font-weight:950}.sub{font-size:13px;color:var(--muted);margin:4px 0 14px}.toprow{display:flex;gap:8px;margin:8px 0}.btn{border:0;border-radius:14px;background:var(--green);color:#06110b;font-weight:900;padding:12px 14px;font-size:15px;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red);color:#260606}.btn.full{width:100%}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:11px;font-weight:900}.tab.active{background:var(--green);color:#06110b}.search,input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:13px;font-size:16px;font-family:inherit}.search{background:var(--panel);margin-bottom:12px}.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:8px}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 11px;font-weight:850}.filter.active{background:var(--green);color:#06110b}.rocard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}.rocard.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(56,210,125,.15)}.rotitle{display:flex;justify-content:space-between;gap:8px}.ronum{font-weight:950;font-size:17px}.veh{color:var(--muted);font-size:14px;margin-top:4px}.area{font-size:13px;margin-top:8px}.pill{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;background:#2b3340;color:var(--muted);white-space:nowrap;margin:2px}.status-intacto{background:rgba(93,169,255,.16);color:var(--blue)}.status-revision{background:rgba(255,189,89,.17);color:var(--amber)}.status-aprobado{background:rgba(185,140,255,.18);color:var(--purple)}.status-proceso{background:rgba(56,210,125,.17);color:var(--green)}.status-piezas{background:rgba(255,107,107,.16);color:var(--red)}.status-pintura{background:rgba(93,169,255,.16);color:#83c0ff}.status-armado{background:rgba(56,210,125,.17);color:var(--green)}.status-entregado{background:rgba(170,179,194,.18);color:#cdd5df}.bar{height:8px;background:#2d3541;border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;background:var(--green)}.hours{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.header{display:flex;justify-content:space-between;gap:14px}.h1{font-size:28px;font-weight:950}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}.label{font-size:12px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.6px}.value{font-size:20px;font-weight:950;margin-top:5px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.stage{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:10px 8px;text-align:center;min-height:78px;display:flex;flex-direction:column;justify-content:center}.stage .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:#303846;color:var(--muted);font-weight:950}.stage.done{border-color:rgba(56,210,125,.5)}.stage.done .n{background:var(--green);color:#06110b}.stage.current{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,189,89,.15)}.stage.current .n{background:var(--amber);color:#160f00}.stage span{font-size:12px;font-weight:850}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px;cursor:pointer}.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--green);display:grid;place-items:center;font-weight:950;color:var(--green);flex:0 0 24px}.check.done{opacity:.75}.check.done .box{background:var(--green);color:#06110b}.checktxt{font-weight:850}.small{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{display:grid;place-items:center;min-height:65vh;text-align:center;color:var(--muted)}.dialog{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.dialog.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(640px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 12px}.x{float:right;background:transparent;border:0;color:var(--muted);font-size:28px}.note{background:rgba(255,189,89,.09);border-left:4px solid var(--amber);border-radius:12px;padding:12px;color:#f1e1bd}.oknote{background:rgba(56,210,125,.09);border-left:4px solid var(--green);border-radius:12px;padding:12px}@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;overflow:auto}.left{border-right:0;border-bottom:1px solid var(--line)}.timeline,.grid,.row2{grid-template-columns:1fr}.h1{font-size:24px}.stage{display:grid;grid-template-columns:30px 1fr;text-align:left;align-items:center;min-height:54px}.stage .n{margin:0}.header{display:block}.actions{margin-top:10px}}
</style>
</head>
<body>
<div class="app"><aside class="left"><div class="brand">Body RO Tracker</div><div class="sub">Actuales • Terminados • Sheets sync</div><div class="toprow"><button class="btn full" id="newBtn">+ Nuevo RO</button></div><div class="toprow"><button class="btn secondary full" id="refreshCloudBtn">Actualizar ROs</button><button class="btn secondary full" id="saveCloudBtn">Guardar nube</button></div><div class="toprow"><button class="btn secondary full" id="configCloudBtn">Configurar Sheets / Apps Script</button></div><div id="cloudStatus" class="sub">Modo local. Configura Apps Script para sincronizar.</div><div class="tabs"><button class="tab active" id="tabActive">Actuales <span id="activeCount"></span></button><button class="tab" id="tabDone">Terminados <span id="doneCount"></span></button></div><input id="search" class="search" placeholder="Buscar RO, vehículo o área"><div class="filters" id="filters"></div><div id="roList"></div></aside><main class="right"><div id="detail" class="empty">Selecciona un RO del lado izquierdo.</div></main></div>
<div class="dialog" id="modal"><div class="modal"><button class="x" id="closeModal">×</button><h2>Nuevo RO</h2><div class="row2"><input id="m_ro" placeholder="RO number"><input id="m_vehicle" placeholder="Vehículo"></div><br><div class="row2"><input id="m_area" placeholder="Área de daño"><select id="m_status"></select></div><br><div class="row2"><input id="m_est" type="number" step="0.25" placeholder="Horas body estimadas"><input id="m_week" type="number" step="0.25" placeholder="Horas esta semana" value="0"></div><br><textarea id="m_notes" placeholder="Notas del RO"></textarea><br><br><button class="btn full" id="saveNew">Guardar RO</button></div></div>
<script>
(function(){
var STATUSES=[{id:'intacto',name:'Intacto',pct:5,cls:'status-intacto'},{id:'revision',name:'Desarmado revisión',pct:18,cls:'status-revision'},{id:'aprobado',name:'Desarmado aprobado',pct:32,cls:'status-aprobado'},{id:'proceso',name:'En proceso',pct:55,cls:'status-proceso'},{id:'piezas',name:'Esperando piezas',pct:45,cls:'status-piezas'},{id:'pintura',name:'En pintura',pct:70,cls:'status-pintura'},{id:'armado',name:'Armado',pct:88,cls:'status-armado'},{id:'entregado',name:'Entregado',pct:100,cls:'status-entregado'}];
var CHECKS=['Confirmar RO y vehículo','Fotos iniciales / condición intacta','Desarme de área dañada','Revisión de daño oculto','Reparación / cuadratura / fitment','Listo para siguiente etapa'];
var DEFAULT_ACTIVE=[{ro:'45821',vehicle:'2021 Toyota RAV4',area:'Frente izquierdo',status:'revision',est:7,week:2.5,notes:'Bumper off. Revisar bracket detrás del headlamp.',checks:[1,1,0,0,0,0],materials:['P59732 clips x8','Bolsa A: bumper hardware'],history:['RO creado','Movido a Desarmado revisión']},{ro:'45843',vehicle:'2019 Chevy Silverado',area:'Bedside derecho',status:'proceso',est:9.5,week:6.25,notes:'Reparación de bedside en proceso.',checks:[1,1,1,1,0,0],materials:['Sound deadening 0.6 m'],history:['RO creado','En proceso']}];
var DEFAULT_DONE=[{ro:'45788',vehicle:'2020 Ford F-150',area:'Puerta derecha',status:'entregado',est:5,week:0,notes:'Entregado sin pendientes.',checks:[1,1,1,1,1,1],materials:['KT11600 clips x2'],history:['RO creado','Armado','Entregado'],deliveredAt:'2026-07-01'}];
var state={active:[],done:[],selected:null,view:'active',filter:'todos',q:''};var cloud={url:'',apiKey:''};
function today(){return new Date().toISOString().slice(0,10)}function stamp(m){return today()+' — '+m}function st(id){return STATUSES.find(function(s){return s.id===id})||STATUSES[0]}function idx(id){return STATUSES.findIndex(function(s){return s.id===id})}function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c})}function arr(){return state.view==='active'?state.active:state.done}function save(){localStorage.setItem('body_ro_tracker_archive_v3',JSON.stringify({active:state.active,done:state.done,view:state.view}))}function addHistory(r,m){r.history=r.history||[];r.history.push(stamp(m))}function hasArmadoWait(r){return r&&r.status==='armado'&&(r.armadoWait==='piezas'||r.armadoWait==='suplemento')}function displayStatusName(r){if(hasArmadoWait(r))return r.armadoWait==='suplemento'?'Armado · esperando suplemento':'Armado · esperando piezas';return st(r.status).name}function displayStatusClass(r){return hasArmadoWait(r)?'status-piezas':st(r.status).cls}function clearWait(r){if(r.status!=='armado')r.armadoWait=''}
function load(){try{var c=localStorage.getItem('body_ro_cloud_config_v1');if(c)cloud=JSON.parse(c)}catch(e){}try{var x=localStorage.getItem('body_ro_tracker_archive_v3')||localStorage.getItem('body_ro_tracker_archive_v2');if(x){var d=JSON.parse(x);state.active=d.active||[];state.done=d.done||[];state.view=d.view||'active'}}catch(e){}if(!state.active.length&&!state.done.length){state.active=DEFAULT_ACTIVE.slice();state.done=DEFAULT_DONE.slice()}state.selected=(arr()[0]||state.active[0]||state.done[0]||{}).ro||null}
function moveToDone(ro){var i=state.active.findIndex(function(x){return x.ro===ro});if(i<0)return;var r=state.active[i];if(hasArmadoWait(r)){alert('No se puede entregar: el RO está en Armado pero sigue esperando piezas o suplemento.');return}state.active.splice(i,1);r.status='entregado';r.armadoWait='';r.week=0;r.deliveredAt=today();addHistory(r,'Marcado como Entregado y movido a Terminados');state.done.unshift(r);state.view='done';state.selected=r.ro;save();render()}
function reopen(ro){var i=state.done.findIndex(function(x){return x.ro===ro});if(i<0)return;var r=state.done.splice(i,1)[0];r.status='intacto';r.week=0;r.returnedAt=today();addHistory(r,'Reingresó al taller como Intacto');state.active.unshift(r);state.view='active';state.selected=r.ro;save();render()}
function renderTabs(){tabActive.className='tab '+(state.view==='active'?'active':'');tabDone.className='tab '+(state.view==='done'?'active':'');activeCount.textContent='('+state.active.length+')';doneCount.textContent='('+state.done.length+')'}
function renderFilters(){var h='<button class="filter '+(state.filter==='todos'?'active':'')+'" data-f="todos">Todos</button>';if(state.view==='active')STATUSES.filter(function(s){return s.id!=='entregado'}).forEach(function(s){h+='<button class="filter '+(state.filter===s.id?'active':'')+'" data-f="'+s.id+'">'+s.name+'</button>'});else h+='<button class="filter active" data-f="entregado">Entregado</button>';filters.innerHTML=h;document.querySelectorAll('.filter').forEach(function(b){b.onclick=function(){state.filter=this.dataset.f;render()}})}
function filtered(){var q=state.q.toLowerCase().trim();return arr().filter(function(r){var ok=state.filter==='todos'||r.status===state.filter;var hit=!q||(r.ro+' '+r.vehicle+' '+r.area+' '+r.notes).toLowerCase().includes(q);return ok&&hit})}
function renderList(){var h='';filtered().forEach(function(r){var s=st(r.status),d=displayStatusName(r);h+='<div class="rocard '+(state.selected===r.ro?'active':'')+'" data-ro="'+esc(r.ro)+'"><div class="rotitle"><div><div class="ronum">RO '+esc(r.ro)+'</div><div class="veh">'+esc(r.vehicle)+'</div></div><span class="pill '+displayStatusClass(r)+'">'+d+'</span></div><div class="area">'+esc(r.area)+'</div><div class="bar"><div class="fill" style="width:'+s.pct+'%"></div></div><div class="hours"><span>'+(state.view==='done'?'Entregado: '+esc(r.deliveredAt||'sin fecha'):Number(r.week||0).toFixed(2)+' hrs semana')+'</span><span>'+Number(r.est||0).toFixed(2)+' hrs est.</span></div></div>'});roList.innerHTML=h||'<div class="muted">Sin ROs.</div>';document.querySelectorAll('.rocard').forEach(function(c){c.onclick=function(){state.selected=this.dataset.ro;render()}})}
function findSel(){return arr().find(function(x){return x.ro===state.selected})}
function renderDetail(){var r=findSel();if(!r){detail.className='empty';detail.innerHTML='Selecciona un RO del lado izquierdo.';return}detail.className='';var isDone=state.view==='done',s=st(r.status),d=displayStatusName(r),stage='';STATUSES.forEach(function(x,i){var c=i<idx(r.status)?'done':(x.id===r.status?'current':'');stage+='<div class="stage '+c+'"><div class="n">'+(i+1)+'</div><span>'+x.name+'</span></div>'});var checks='';CHECKS.forEach(function(c,i){var done=r.checks&&r.checks[i];checks+='<div class="check '+(done?'done':'')+'" data-i="'+i+'"><div class="box">'+(done?'✓':'')+'</div><div><div class="checktxt">'+c+'</div><div class="small">Toca para marcar / desmarcar</div></div></div>'});var mat=(r.materials||[]).map(function(m){return '<span class="pill">'+esc(m)+'</span>'}).join(' ')||'<span class="muted">Sin materiales registrados</span>';var hist=(r.history||[]).map(function(x){return '<div class="small">• '+esc(x)+'</div>'}).join('')||'<div class="small">Sin historial.</div>';var armado='';if(!isDone&&r.status==='armado')armado='<button class="btn secondary" id="waitParts">Armado esperando piezas</button><button class="btn secondary" id="waitSupp">Armado esperando suplemento</button>'+(hasArmadoWait(r)?'<button class="btn" id="clearWait">Listo para continuar armado</button>':'');var controls=isDone?'<button class="btn" id="reopenRO">Regresó al taller → mover a Actuales</button>':'<button class="btn secondary" id="prevStatus">← Estado anterior</button><select id="statusSelect"></select><button class="btn" id="nextStatus">Siguiente estado →</button><button class="btn danger" id="deliverNow">Marcar entregado</button>'+armado;detail.innerHTML='<div class="panel"><div class="header"><div><div class="h1">RO '+esc(r.ro)+' • '+esc(r.vehicle)+'</div><div class="muted">'+esc(r.area)+'</div></div><span class="pill '+displayStatusClass(r)+'">'+d+'</span></div><div class="grid"><div class="mini"><div class="label">Lista</div><div class="value">'+(isDone?'Terminado':'Actual')+'</div></div><div class="mini"><div class="label">Estado</div><div class="value">'+d+'</div></div><div class="mini"><div class="label">Horas semana</div><div class="value">'+Number(r.week||0).toFixed(2)+'</div></div><div class="mini"><div class="label">Horas est.</div><div class="value">'+Number(r.est||0).toFixed(2)+'</div></div></div></div><div class="panel"><div class="label">Proceso del coche</div><div class="timeline">'+stage+'</div><br><div class="actions">'+controls+'</div>'+(hasArmadoWait(r)?'<br><div class="note"><b>Armado detenido:</b> sigue en Armado, pero no debe entregarse hasta resolver piezas/suplemento.</div>':'')+'</div>'+(isDone?'<div class="panel oknote"><b>RO terminado:</b> ya no aparece en actuales. Se puede consultar o reingresar.</div>':'')+'<div class="panel"><div class="label">Sumar horas esta semana</div><div class="actions"><button class="btn secondary addh" data-h="0.25">+0.25</button><button class="btn secondary addh" data-h="0.5">+0.5</button><button class="btn secondary addh" data-h="1">+1.0</button><button class="btn secondary addh" data-h="2">+2.0</button><button class="btn secondary" id="resetWeek">Reset semana</button></div></div><div class="panel"><div class="label">Checklist body / reparación</div>'+checks+'</div><div class="panel"><div class="label">Hardware y materiales</div><p>'+mat+'</p><div class="row2"><input id="matInput" placeholder="Ej: P59732 clips x4"><button class="btn secondary" id="addMat">Agregar</button></div></div><div class="panel"><div class="label">Notas del RO</div><textarea id="notesBox">'+esc(r.notes)+'</textarea><br><br><button class="btn secondary" id="saveNotes">Guardar notas</button></div><div class="panel"><div class="label">Historial</div>'+hist+'</div>';if(isDone){reopenRO.onclick=function(){if(confirm('¿Mover a Actuales como Intacto?'))reopen(r.ro)}}else{var ss=statusSelect;STATUSES.filter(function(x){return x.id!=='entregado'}).forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.name;if(x.id===r.status)o.selected=true;ss.appendChild(o)});ss.onchange=function(){r.status=this.value;clearWait(r);addHistory(r,'Estado cambiado a '+displayStatusName(r));save();render()};prevStatus.onclick=function(){r.status=STATUSES[Math.max(0,idx(r.status)-1)].id;clearWait(r);addHistory(r,'Estado cambiado a '+displayStatusName(r));save();render()};nextStatus.onclick=function(){var i=Math.min(STATUSES.length-1,idx(r.status)+1);if(STATUSES[i].id==='entregado')moveToDone(r.ro);else{r.status=STATUSES[i].id;clearWait(r);addHistory(r,'Estado cambiado a '+displayStatusName(r));save();render()}};deliverNow.onclick=function(){if(confirm('¿Marcar entregado?'))moveToDone(r.ro)};if(window.waitParts)waitParts.onclick=function(){r.armadoWait='piezas';addHistory(r,'Armado esperando piezas');save();render()};if(window.waitSupp)waitSupp.onclick=function(){r.armadoWait='suplemento';addHistory(r,'Armado esperando suplemento');save();render()};if(window.clearWait)clearWait.onclick=function(){r.armadoWait='';addHistory(r,'Pendiente de armado resuelto');save();render()}}document.querySelectorAll('.addh').forEach(function(b){b.onclick=function(){if(isDone)return;r.week=Number(r.week||0)+Number(this.dataset.h);addHistory(r,'Horas +'+this.dataset.h);save();render()}});if(window.resetWeek)resetWeek.onclick=function(){if(isDone)return;r.week=0;addHistory(r,'Horas semanales reiniciadas');save();render()};document.querySelectorAll('.check').forEach(function(c){c.onclick=function(){if(isDone)return;var i=Number(this.dataset.i);r.checks=r.checks||[];r.checks[i]=r.checks[i]?0:1;addHistory(r,(r.checks[i]?'Completado: ':'Desmarcado: ')+CHECKS[i]);save();render()}});if(window.addMat)addMat.onclick=function(){if(isDone)return;var v=matInput.value.trim();if(v){r.materials=r.materials||[];r.materials.push(v);addHistory(r,'Material/hardware agregado: '+v);save();render()}};saveNotes.onclick=function(){r.notes=notesBox.value;addHistory(r,'Notas actualizadas');save();render()}}
function setCloudStatus(m){cloudStatus.textContent=m}function saveCloudConfig(){localStorage.setItem('body_ro_cloud_config_v1',JSON.stringify(cloud))}function configureCloud(){var u=prompt('URL Apps Script /exec:',cloud.url||'');if(u===null)return;var k=prompt('API key privada:',cloud.apiKey||'');if(k===null)return;cloud.url=(u||'').trim();cloud.apiKey=(k||'').trim();saveCloudConfig();setCloudStatus(cloud.url?'Conexión configurada.':'Modo local. Falta URL.')}function cloudReady(){if(!cloud.url){alert('Configura Apps Script primero.');return false}return true}
function norm(x){var r={ro:String(x.ro||x.ro_number||'').trim(),vehicle:x.vehicle||x.vehiculo||'',area:x.area||x.damage_area||'',status:x.status||'intacto',armadoWait:x.armadoWait||x.assembly_hold||'',est:Number(x.est||x.body_hours_estimated||0),week:Number(x.week||x.body_hours_week||0),notes:x.notes||'',checks:Array.isArray(x.checks)?x.checks:parseJSON(x.checklist_done,[0,0,0,0,0,0]),materials:Array.isArray(x.materials)?x.materials:parseJSON(x.materials_json,[]),history:Array.isArray(x.history)?x.history:parseJSON(x.history_json,[]),deliveredAt:x.deliveredAt||x.delivered_at||''};clearWait(r);return r}function parseJSON(v,d){try{return typeof v==='string'&&v?JSON.parse(v):d}catch(e){return d}}
async function refreshFromCloud(){if(!cloudReady())return;setCloudStatus('Actualizando...');try{var url=cloud.url+(cloud.url.includes('?')?'&':'?')+'action=list&apiKey='+encodeURIComponent(cloud.apiKey||'');var res=await fetch(url,{cache:'no-store'});var data=await res.json();if(!data.ok)throw new Error(data.error||'Error');state.active=[];state.done=[];(data.ros||[]).forEach(function(x){var r=norm(x);if(!r.ro)return;var fin=String(x.is_finished||'').toLowerCase()==='true'||r.status==='entregado'||!!r.deliveredAt;if(fin){r.status='entregado';state.done.push(r)}else state.active.push(r)});state.view='active';state.selected=(state.active[0]||state.done[0]||{}).ro||null;save();render();setCloudStatus('Actualizado: '+(data.ros||[]).length+' RO(s).')}catch(e){setCloudStatus('Error: '+e.message);alert('No pude leer Sheets: '+e.message)}}
async function pushToCloud(){if(!cloudReady())return;setCloudStatus('Guardando...');try{var payload={apiKey:cloud.apiKey||'',action:'save_all',active:state.active,done:state.done};var res=await fetch(cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});var data=await res.json();if(!data.ok)throw new Error(data.error||'Error');setCloudStatus('Guardado: '+(data.count||0)+' RO(s).')}catch(e){setCloudStatus('Error: '+e.message);alert('No pude guardar Sheets: '+e.message)}}
function fillStatusSelect(id){var sel=document.getElementById(id);sel.innerHTML='';STATUSES.filter(function(s){return s.id!=='entregado'}).forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name;sel.appendChild(o)})}function render(){renderTabs();renderFilters();renderList();renderDetail()}
search.oninput=function(){state.q=this.value;renderList()};tabActive.onclick=function(){state.view='active';state.filter='todos';state.selected=(state.active[0]||{}).ro||null;save();render()};tabDone.onclick=function(){state.view='done';state.filter='todos';state.selected=(state.done[0]||{}).ro||null;save();render()};newBtn.onclick=function(){fillStatusSelect('m_status');modal.classList.add('show')};closeModal.onclick=function(){modal.classList.remove('show')};modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('show')});saveNew.onclick=function(){var r={ro:m_ro.value.trim(),vehicle:m_vehicle.value.trim(),area:m_area.value.trim(),status:m_status.value,est:Number(m_est.value||0),week:Number(m_week.value||0),notes:m_notes.value,checks:[0,0,0,0,0,0],materials:[],armadoWait:'',history:[stamp('RO creado')]};if(!r.ro||!r.vehicle){alert('Falta RO o vehículo');return}state.active.unshift(r);state.view='active';state.selected=r.ro;save();modal.classList.remove('show');render()};refreshCloudBtn.onclick=refreshFromCloud;saveCloudBtn.onclick=pushToCloud;configCloudBtn.onclick=configureCloud;load();render();setCloudStatus(cloud.url?'Conexión configurada.':'Modo local. Configura Apps Script para sincronizar.');
})();
