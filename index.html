<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanzas SZR" />
  <title>Finanzas SZR</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <section class="hero-card glass">
      <div class="status-row">
        <span id="todayLabel">Hoy</span>
        <span class="pill">SZR Finance</span>
      </div>
      <div class="hero-title">
        <div>
          <p class="muted">Balance actual</p>
          <h1 id="balanceAmount">$0.00</h1>
        </div>
        <button type="button" class="round-button" id="themeToggle" aria-label="Cambiar tema">◐</button>
      </div>
      <div class="mini-grid">
        <div>
          <span>Ingresos</span>
          <strong id="incomeAmount">$0.00</strong>
        </div>
        <div>
          <span>Gastos</span>
          <strong id="expenseAmount">$0.00</strong>
        </div>
        <div>
          <span>Libre</span>
          <strong id="freeAmount">$0.00</strong>
        </div>
      </div>
    </section>

    <section class="quick-actions" aria-label="Acciones rápidas">
      <button type="button" data-type="income" class="action-card income active">+ Ingreso</button>
      <button type="button" data-type="expense" class="action-card expense">− Gasto</button>
      <button type="button" id="exportBtn" class="action-card neutral">Exportar</button>
    </section>

    <section class="panel glass" id="movementPanel">
      <div class="section-title">
        <h2>Nuevo movimiento</h2>
        <span>iPhone ready</span>
      </div>
      <form id="transactionForm">
        <div class="segmented">
          <input type="radio" name="type" id="typeIncome" value="income" checked />
          <label for="typeIncome">Ingreso</label>
          <input type="radio" name="type" id="typeExpense" value="expense" />
          <label for="typeExpense">Gasto</label>
        </div>
        <label class="field">
          <span>Descripción</span>
          <input id="description" type="text" placeholder="Ej. Pago semanal, gasolina, herramienta" required />
        </label>
        <div class="two-col">
          <label class="field">
            <span>Monto</span>
            <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required />
          </label>
          <label class="field">
            <span>Categoría</span>
            <select id="category">
              <option>Trabajo</option>
              <option>Casa</option>
              <option>Comida</option>
              <option>Gasolina</option>
              <option>Herramientas</option>
              <option>Vehículo</option>
              <option>Taller / Negocio</option>
              <option>Viajes</option>
              <option>Ahorro</option>
              <option>Otro</option>
            </select>
          </label>
        </div>
        <button class="primary-button" type="submit">Guardar movimiento</button>
      </form>
    </section>

    <section class="panel glass">
      <div class="section-title">
        <h2>Metas</h2>
        <span id="goalProgressLabel">0%</span>
      </div>
      <div class="goal-card">
        <div>
          <strong>Fondo / Proyecto principal</strong>
          <p>Define una meta para Tacoma, herramientas, ADAS o taller.</p>
        </div>
        <div class="progress"><span id="goalBar"></span></div>
        <div class="goal-inputs">
          <input id="goalName" placeholder="Nombre de meta" />
          <input id="goalTarget" type="number" inputmode="decimal" placeholder="Meta $" />
          <input id="goalSaved" type="number" inputmode="decimal" placeholder="Ahorrado $" />
        </div>
        <button type="button" id="saveGoal" class="secondary-button">Actualizar meta</button>
      </div>
    </section>

    <section class="panel glass bottom-panel">
      <div class="section-title">
        <h2>Movimientos</h2>
        <button type="button" id="clearBtn" class="text-button">Limpiar</button>
      </div>
      <div id="transactionList" class="transaction-list empty">Sin movimientos todavía.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
