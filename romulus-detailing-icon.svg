<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Romulus Detailing app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="0.48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#001a38"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d9e4f2"/>
      <stop offset="0.48" stop-color="#6f7d8d"/>
      <stop offset="0.72" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#222b36"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd6ff"/>
      <stop offset="0.35" stop-color="#0078ff"/>
      <stop offset="1" stop-color="#001b4c"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1722"/>
      <stop offset="0.5" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="190" fill="none" stroke="url(#metal)" stroke-width="20" opacity="0.94"/>
