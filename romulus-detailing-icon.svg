  <path d="M140 104h744" stroke="#4cc8ff" stroke-width="10" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M172 922h680" stroke="#087dff" stroke-width="7" stroke-linecap="round" opacity="0.65" filter="url(#glow)"/>

