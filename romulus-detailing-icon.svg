    <path d="M206 649c90-23 175-37 253-42 109-7 212 5 309 35" fill="none" stroke="#f9fbff" stroke-width="13" stroke-linecap="round" opacity="0.88"/>
    <path d="M223 656c-23 12-39 28-48 49h694c-10-23-28-39-55-49H223z" fill="url(#metal)"/>
    <circle cx="309" cy="705" r="64" fill="#020409"/>
